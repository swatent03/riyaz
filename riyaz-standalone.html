<style>
:root{--bg:#0b1f33;--panel:#11294a;--panel2:#0e2340;--line:#1e3a5f;--teal:#14b8a6;--teal2:#5eead4;--amber:#f59e0b;--red:#ef4444;--green:#22c55e;--txt:#e6f0fa;--mut:#8aa4c0;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--teal2)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,31,51,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;color:var(--txt);text-decoration:none}
.brand b{color:var(--teal)}
.top .sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:6px 10px;font:inherit;text-decoration:none}
main{max-width:720px;margin:auto;padding:12px 14px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#081829;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;padding:9px 2px 10px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
.tabs a .ic{display:block;font-size:19px;line-height:1.1;margin-bottom:1px}
.tabs a.on{color:var(--teal2)}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:4px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.hl{border-color:var(--teal)}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:11.5px}
.ok{color:var(--teal2)}.bad{color:#fca5a5}.warn{color:#fcd34d}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;text-decoration:none;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#05221f}
.btn.danger{background:#3a1515;border-color:#7f1d1d;color:#fecaca}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
input,select,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{width:100%;min-height:260px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
input[type=text]{width:100%}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:4px 0 10px}
.seg a,.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:9px;color:var(--mut);text-decoration:none;font:inherit;font-weight:600;font-size:14px;background:none;border:0}
.seg .on{background:var(--teal);color:#05221f}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{background:#0f4f4a;color:var(--teal2)}.pill.warn{background:#4a3a10;color:#fcd34d}.pill.bad{background:#4c1d1d;color:#fca5a5}
.big{font-size:44px;font-weight:800;line-height:1.05}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi .v{font-size:22px;font-weight:800}
.kpi .l{font-size:11.5px;color:var(--mut)}
.block{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.block:first-of-type{border-top:0}
.block .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.block .chk.done{background:var(--teal);border-color:var(--teal);color:#05221f}
.block .t{font-weight:700}
.focus{font-size:11px;color:#fcd34d;margin-left:6px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.banner{position:sticky;top:53px;z-index:4;background:#0f4f4a;color:var(--teal2);border-radius:12px;padding:8px 12px;margin:0 0 8px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.banner.over{background:#4a3a10;color:#fcd34d}
.readout{text-align:center}
.note{font-size:58px;font-weight:800;line-height:1}
.meter{position:relative;height:22px;margin:10px 4px 2px;border-radius:8px;background:linear-gradient(90deg,#4c1d1d 0%,#4a3a10 25%,#0f4f4a 40%,#0f4f4a 60%,#4a3a10 75%,#4c1d1d 100%)}
.meter .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#cfe3f7;transform:translateX(-1px)}
.needle{position:absolute;top:-5px;bottom:-5px;width:6px;border-radius:3px;background:#fff;left:50%;transform:translateX(-3px);opacity:.25}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:0 4px}
canvas.trace{width:100%;height:220px;display:block;background:#0a1a2c;border-radius:12px;border:1px solid var(--line)}
.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.diag{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;cursor:pointer;color:var(--txt);font:inherit}
.diag .n{font-weight:800;font-size:15px}
.diag.hard{border-color:#7a5a12}
.sheet{font:14px/1.35 ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace;white-space:pre;overflow-x:auto;background:#0a1a2c;border:1px solid var(--line);border-radius:12px;padding:12px}
.sheet .ch{color:var(--teal2);font-weight:700}
.sheet .ch.cur{background:var(--teal);color:#05221f;border-radius:4px}
.sheet .hd{color:#fcd34d;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}
.slot{text-align:center;padding:8px 0;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:800;color:var(--mut)}
.slot.hit{color:var(--txt)}
.slot.cur{background:var(--teal);color:#05221f;border-color:var(--teal)}
.slot .c{display:block;font-size:10px;font-weight:600;opacity:.8}
.pad{width:100%;height:170px;border-radius:18px;border:2px dashed var(--teal);background:#0a2a33;color:var(--teal2);font:inherit;font-size:20px;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad:active,.pad.flash{background:#0f4f4a}
.timer{font-size:72px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--teal2)}
.counter{display:flex;align-items:center;justify-content:center;gap:14px}
.counter .val{font-size:48px;font-weight:800;min-width:90px;text-align:center}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rung{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut);cursor:pointer;font:inherit;font-size:12px}
.rung b{display:block;font-size:15px;color:var(--txt)}
.rung.on{border-color:var(--teal);background:#0f3a3a}
.rung.locked{opacity:.45}
.rung.passed b{color:var(--teal2)}
.now{display:flex;gap:12px;align-items:center}
.now .cur{font-size:50px;font-weight:800;color:var(--teal2);min-width:110px}
.now .nx{color:var(--mut)}
.spark{width:100%;height:60px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.cal span.on{background:var(--teal);border-color:var(--teal)}
.cal span.today{outline:2px solid var(--teal2)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--mut);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.progress>i{display:block;height:100%;width:0;background:var(--teal);transition:width .1s linear}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f4f4a;color:var(--teal2);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.empty{text-align:center;padding:24px 10px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;color:var(--txt);cursor:pointer}
.chip.on{background:var(--teal);color:#05221f;border-color:var(--teal);font-weight:700}
.hidden{display:none!important}
@media (min-width:600px){.big{font-size:52px}}
label.cbx{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;cursor:pointer}
label.cbx input{width:20px;height:20px;flex:none;margin:0;accent-color:#14b8a6}
.btn{white-space:nowrap}

</style>

<script>
/* Riyaz core: pure logic, no DOM. Works in the browser (window.Core) and in Node (require). */
(function (root, factory) {
  const C = factory();
  if (typeof module === 'object' && module.exports) module.exports = C;
  else root.Core = C;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------------------------------------------------------------- notes
  const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const SHAPE = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B'];
  const LETTER = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const mod = (n, m) => ((n % m) + m) % m;

  function pcOf(name) {
    const m = /^([A-Ga-g])([#b♯♭]?)$/.exec(name);
    if (!m) return null;
    let p = LETTER[m[1].toUpperCase()];
    if (m[2] === '#' || m[2] === '♯') p++;
    else if (m[2] === 'b' || m[2] === '♭') p--;
    return mod(p, 12);
  }
  const midiToFreq = (m, a4 = 440) => a4 * Math.pow(2, (m - 69) / 12);
  const freqToMidi = (f, a4 = 440) => 69 + 12 * Math.log2(f / a4);
  function noteName(m, flats) {
    const r = Math.round(m);
    return (flats ? FLAT : SHARP)[mod(r, 12)] + (Math.floor(r / 12) - 1);
  }
  function parseNote(s) {
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(s).trim());
    if (!m) return null;
    return LETTER[m[1].toUpperCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  }
  const median = (a) => {
    if (!a.length) return NaN;
    const s = [...a].sort((x, y) => x - y), k = s.length >> 1;
    return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2;
  };
  const foldCents = (c) => mod(c + 600, 1200) - 600;

  // ---------------------------------------------------------------- pitch (YIN)
  function yin(x, sr, thr = 0.15, minF = 60, maxF = 1200) {
    const tauMin = Math.max(2, Math.floor(sr / maxF));
    const tauMax = Math.min(Math.floor(sr / minF), Math.floor(x.length / 2));
    const W = x.length - tauMax - 1;
    if (W < 16) return null;
    const d = new Float32Array(tauMax + 2);
    for (let tau = 1; tau <= tauMax + 1; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const v = x[j] - x[j + tau]; s += v * v; }
      d[tau] = s;
    }
    d[0] = 1;
    let run = 0;
    for (let tau = 1; tau <= tauMax + 1; tau++) { run += d[tau]; d[tau] = run > 0 ? d[tau] * tau / run : 1; }
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (d[t] < thr) { while (t + 1 <= tauMax && d[t + 1] < d[t]) t++; tau = t; break; }
    }
    if (tau < 0) return null;
    let bt = tau;
    if (tau > 1 && tau <= tauMax) {
      const a = d[tau - 1], b = d[tau], c = d[tau + 1], den = a + c - 2 * b;
      if (den > 0) bt = tau + (a - c) / (2 * den);
    }
    return { f: sr / bt, clarity: 1 - d[tau] };
  }
  function rmsDb(x) {
    let s = 0;
    for (let i = 0; i < x.length; i++) s += x[i] * x[i];
    return 20 * Math.log10(Math.sqrt(s / x.length) + 1e-12);
  }

  // ---------------------------------------------------------------- chords
  const QUAL = {
    '': '', maj: '', M: '',
    maj7: 'maj7', M7: 'maj7', 'Δ': 'maj7', 'Δ7': 'maj7', maj9: 'maj9',
    m: 'm', mi: 'm', min: 'm', '-': 'm',
    m7: 'm7', mi7: 'm7', min7: 'm7', '-7': 'm7', m9: 'm9', m11: 'm11', m6: 'm6',
    madd9: 'madd9', 'm(add9)': 'madd9', mmaj7: 'mmaj7', 'm(maj7)': 'mmaj7',
    m7b5: 'm7b5', 'm7(b5)': 'm7b5', 'ø': 'm7b5', 'ø7': 'm7b5',
    dim: 'dim', '°': 'dim', dim7: 'dim7', '°7': 'dim7',
    aug: 'aug', '+': 'aug',
    sus: 'sus4', sus4: 'sus4', sus2: 'sus2', '7sus4': '7sus4', '7sus': '7sus4', '7sus2': '7sus2',
    add9: 'add9', '(add9)': 'add9', add2: 'add9', add11: 'add11', add4: 'add11',
    '6': '6', '6/9': '6/9', '69': '6/9', '7': '7', '9': '9', '11': '11', '13': '13', '5': '5',
    '7b9': '7', '7#9': '7', '7#5': 'aug', '7b5': '7',
  };
  const MINORISH = new Set(['m', 'm7', 'm9', 'm11', 'm6', 'madd9', 'mmaj7']);
  const DIMISH = new Set(['dim', 'dim7', 'm7b5']);

  function parseChord(tok) {
    if (!tok) return null;
    const t = String(tok).trim().replace(/[*,.;!?]+$/, '');
    const m = /^([A-G][#b♯♭]?)([^/]*)(?:\/([A-G][#b♯♭]?))?$/.exec(t);
    if (!m) return null;
    if (!(m[2] in QUAL)) return null;
    const root = pcOf(m[1]);
    const bass = m[3] ? pcOf(m[3]) : null;
    if (root === null) return null;
    return { root, q: QUAL[m[2]], bass, src: t, flat: /b|♭/.test(m[1].slice(1)) };
  }
  function triadClass(q) { return DIMISH.has(q) ? 'd' : MINORISH.has(q) ? 'm' : 'M'; }
  function transposeChord(c, k) {
    return { ...c, root: mod(c.root + k, 12), bass: c.bass === null ? null : mod(c.bass + k, 12) };
  }
  const SIMPLE = {
    maj9: 'maj7', '9': '7', '11': '7', '13': '7', m9: 'm7', m11: 'm7', madd9: 'm', mmaj7: 'm',
    add11: '', '6/9': '', '6': '', m6: 'm', '7sus2': 'sus2', dim7: 'dim', '5': '',
  };
  function simplifyChord(c) {
    return { ...c, q: c.q in SIMPLE ? SIMPLE[c.q] : c.q, bass: null };
  }
  function chordName(c, style = 'sharp') {
    const names = style === 'flat' ? FLAT : style === 'shape' ? SHAPE : SHARP;
    let s = names[c.root] + c.q;
    if (c.bass !== null && c.bass !== undefined) s += '/' + names[c.bass];
    return s;
  }

  // Guitar voicings, low E -> high E. 'x' = muted. Numbers = absolute frets.
  const VOICING = {
    C: 'x32010', D: 'xx0232', E: '022100', G: '320003', A: 'x02220',
    Am: 'x02210', Em: '022000', Dm: 'xx0231',
    E7: '020100', A7: 'x02020', D7: 'xx0212', G7: '320001', C7: 'x32310', B7: 'x21202',
    Am7: 'x02010', Em7: '020000', Dm7: 'xx0211', Bm7: 'x20202',
    Cmaj7: 'x32000', Fmaj7: 'xx3210', Amaj7: 'x02120', Dmaj7: 'xx0222', Gmaj7: '320002', Emaj7: '021100',
    Dsus2: 'xx0230', Dsus4: 'xx0233', Asus2: 'x02200', Asus4: 'x02230', Esus4: '022200',
    Cadd9: 'x32030', Gsus4: '330013', Csus2: 'x30013',
    F: 'xx3211', Bm: 'x24432', 'F#m': '244222', B: 'x24442', Fm: '133111',
    Bdim: 'x2343x', 'C#dim': 'x4565x', Adim: 'x0121x', Ddim: 'xx0131',
  };
  const COST = {
    C: 1, D: 1, E: 1, G: 1, A: 1, Am: 1, Em: 1, Dm: 1.2,
    E7: 1.1, A7: 1.1, D7: 1.3, G7: 1.3, C7: 1.5, B7: 1.7, Am7: 1.1, Em7: 1, Dm7: 1.4, Bm7: 2.2,
    Cmaj7: 1.1, Fmaj7: 1.4, Amaj7: 1.4, Dmaj7: 1.4, Gmaj7: 1.4, Emaj7: 1.6,
    Dsus2: 1.2, Dsus4: 1.2, Asus2: 1.1, Asus4: 1.2, Esus4: 1.2, Cadd9: 1.2, Gsus4: 1.6, Csus2: 1.8,
    F: 2.6, Bm: 3, 'F#m': 3.2, B: 3.4, Fm: 3.4,
    Bdim: 3, 'C#dim': 3.2, Adim: 2.6, Ddim: 2.8,
  };
  const BARRE_E = { '': [0, 2, 2, 1, 0, 0], m: [0, 2, 2, 0, 0, 0], '7': [0, 2, 0, 1, 0, 0], m7: [0, 2, 0, 0, 0, 0], sus4: [0, 2, 2, 2, 0, 0] };
  const BARRE_A = { '': [null, 0, 2, 2, 2, 0], m: [null, 0, 2, 2, 1, 0], '7': [null, 0, 2, 0, 2, 0], m7: [null, 0, 2, 0, 1, 0], sus2: [null, 0, 2, 2, 0, 0], sus4: [null, 0, 2, 2, 3, 0], maj7: [null, 0, 2, 1, 2, 0] };

  function shapeName(c) { return chordName({ ...c, bass: null }, 'shape'); }
  function shapeCost(c) {

    let met = null;
    cleanup(() => met && met.stop());
    const go = h('button', { class: 'btn primary block', type: 'button' }, 'Start round (1 count-in bar + 4 bars)');
    go.onclick = async () => {
      await A.ensure();
      go.disabled = true;
      const b = bpm(), bars = 4, e = 60 / b / 2;
      taps = [];
      const slotEls = [...slots.children];
      met = A.metronome({
        bpm: b, eighths: false, totalEighths: 8 * (bars + 1), startDelay: 0.4,
        onEighth: (i) => {
          slotEls.forEach((s) => s.classList.remove('cur'));
          if (i >= 8) slotEls[i % 8].classList.add('cur');
          msg.textContent = i < 8 ? `Count-in: ${Math.floor(i / 2) + 1}` : `Bar ${Math.floor(i / 8)} of ${bars}`;
        },
      });
      const expected = C.patternHits(pat.slots, b, bars, met.t0 + 8 * e).map((x) => x.t);
      window.Riyaz._strumExpected = expected;
      const endAt = met.t0 + 8 * (bars + 1) * e + 0.35;
      while (A.ctx.currentTime < endAt) await sleep(50);
      met.stop();
      slotEls.forEach((s) => s.classList.remove('cur'));
      const window0 = met.t0 + 8 * e - 0.25;
      const r = C.scoreTaps(expected, taps.filter((t) => t >= window0), b);
      taps = null;
      const nb = C.nextTempo(b, r.score);
      st().strum.history.push({ pattern: pat.id, bpm: b, score: r.score, meanAbsMs: r.meanAbsMs, biasMs: r.biasMs, date: Date.now() });
      st().strum.bpm[pat.id] = nb;
      U.practised('strum');
      const bias = r.biasMs === null ? '' : Math.abs(r.biasMs) < 15 ? 'Timing centred.' : r.biasMs > 0 ? `You tend to be ${r.biasMs} ms late.` : `You tend to be ${-r.biasMs} ms early (rushing).`;
      msg.innerHTML = '';
      msg.append(h('div', { class: 'big ' + (r.score >= 85 ? 'ok' : r.score >= 50 ? 'warn' : 'bad'), id: 'strumScore' }, r.score + '%'),
        h('div', null, `${r.good} on time · ${r.off} off · ${r.miss} missed · ${r.extras} extra. ${bias}`),
        h('div', { class: 'small' }, nb > b ? `Tempo up to ${nb} bpm.` : nb < b ? `Tempo down to ${nb} bpm. Get it clean first.` : `Stay at ${b} bpm until you hit 85%.`));
      go.disabled = false; go.textContent = 'Next round';
      paint();
    };
    el.append(h('div', { class: 'card' }, chips, h('div', { class: 'row between', style: 'margin-top:8px' }, h('span', null, 'Tempo: ', bpmV),
      h('span', { class: 'row' }, h('button', { class: 'btn sm', type: 'button', onclick: () => { st().strum.bpm[pat.id] = Math.max(40, bpm() - 5); U.save(); paint(); } }, '−5'), h('button', { class: 'btn sm', type: 'button', onclick: () => { st().strum.bpm[pat.id] = Math.min(160, bpm() + 5); U.save(); paint(); } }, '+5'))), slots),
      h('div', { class: 'card' }, msg, h('div', { style: 'margin:10px 0' }, pad), go),
      h('div', { class: 'card' }, result, h('a', { href: '#/guitar/calibrate', class: 'small' }, 'Scores feel off? Calibrate tap timing')));
    paint();
    return el;
  }, 'guitar');

  route(/^\/guitar\/calibrate$/, () => {
    const msg = h('div', { style: 'font-weight:700' }, 'Tap the pad exactly on each click.');
    const cur = h('div', { class: 'mut small' }, `Current offset: ${st().profile.latencyMs || 0} ms`);
    const pad = h('button', { class: 'pad', type: 'button' }, 'TAP ON THE CLICK');
    let taps = null, met = null;
    cleanup(() => met && met.stop());
    pad.addEventListener('pointerdown', (e) => { e.preventDefault(); if (taps && A.ctx) taps.push(A.perfToAudio(e.timeStamp)); });
    const go = h('button', { class: 'btn primary block', type: 'button' }, 'Start (4 count-in + 8 taps)');
    go.onclick = async () => {
      await A.ensure(); go.disabled = true; taps = [];
      const bpm = 80, beat = 60 / bpm;
      met = A.metronome({ bpm, totalEighths: 24, onEighth: (i) => { if (i % 2 === 0) msg.textContent = i < 8 ? `Listen… ${i / 2 + 1}` : `Tap! ${(i - 8) / 2 + 1}/8`; } });
      const beats = Array.from({ length: 8 }, (_, k) => met.t0 + (4 + k) * beat);
      while (A.ctx.currentTime < met.t0 + 12 * beat + 0.3) await sleep(50);
      met.stop();
      const offs = [];
      for (const b of beats) {
        let best = null;
        for (const t of taps) if (Math.abs(t - b) < beat / 2 && (best === null || Math.abs(t - b) < Math.abs(best - b))) best = t;
        if (best !== null) offs.push((best - b) * 1000);
      }
      go.disabled = false;
      if (offs.length < 6) { msg.textContent = 'Not enough taps caught. Try again.'; return; }
      const off = Math.round(C.median(offs));
      if (Math.abs(off) > 250) { msg.textContent = `Offset of ${off} ms looks wrong. Try again.`; return; }
      st().profile.latencyMs = off; U.save();
      msg.textContent = `Saved: ${off} ms offset.`; cur.textContent = 'Strum scores now subtract this offset.';
    };
    return h('div', null, h('h2', null, 'Calibrate tap timing'), h('div', { class: 'card' }, h('p', { class: 'small mut' }, 'Bluetooth headphones and some phones add delay. This measures your personal offset so strum scores are fair. Use the same speaker or headphones you practise with.'), msg, cur, h('div', { style: 'margin:10px 0' }, pad), go), h('a', { href: '#/guitar/strum' }, '← Back to strumming'));
  }, 'guitar');
})();

</script>
<script>

  route(/^\/song-new$/, () => editor(null), 'songs');
  route(/^\/song\/([\w-]+)\/edit$/, (id) => { const s = findSong(id); return s ? editor(s) : h('div', { class: 'card' }, 'Song not found'); }, 'songs');

  function renderSheet(a, mode, onlyLine) {

  }

  // ================================================================ SONG DETAIL
  const KEYS = []; for (let t = 0; t < 12; t++) for (const m of ['major', 'minor']) KEYS.push({ tonic: t, mode: m });
  route(/^\/song\/([\w-]+)$/, (id) => {

    if (a.empty) { el.append(h('div', { class: 'card warn' }, 'No chords recognised. ', h('a', { href: `#/song/${id}/edit` }, 'Edit the song'))); return el; }
    const rerender = () => { U.save(); U.render(); };

    // key card
    const keySel = h('select', { 'aria-label': 'Original key', onchange: (e) => { if (e.target.value === 'auto') delete song.keyOverride; else { const [t, m] = e.target.value.split(':'); song.keyOverride = { tonic: +t, mode: m }; } delete song.capo; rerender(); } },
      h('option', { value: 'auto' }, `Auto (${C.estimateKey(a.sheet.chords).name})`),
      KEYS.map((k) => h('option', { value: k.tonic + ':' + k.mode, selected: song.keyOverride && song.keyOverride.tonic === k.tonic && song.keyOverride.mode === k.mode ? true : null }, C.keyName(k.tonic, k.mode))));

    const fitTxt = !S.profile.range
      ? h('div', { class: 'warn small' }, 'Measure your range so the key can be fitted to your voice. ', h('a', { href: '#/voice/range' }, 'Find my range'))

      [['narrow', 'Narrow melody (about 10 semitones)'], ['typical', 'Typical melody (about 14)'], ['wide', 'Wide melody (about 17)']].map(([v, l]) => h('option', { value: v, selected: (song.span || 'typical') === v ? true : null }, l)));

      class: 'btn sm', type: 'button', onclick: async () => {
        await A.ensure();
        const t = a.fit ? a.fit.tonicMidi : 48 + a.newKey.tonic;

      h('div', { class: 'diagrams', style: 'margin:8px 0' }, a.shapes.map((n) => U.chordCard(n, a.capo))),

    const bpc = h('select', { onchange: (e) => { song.barsPerChord = +e.target.value; U.save(); } }, [1, 2, 4].map((n) => h('option', { value: n, selected: (song.barsPerChord || 1) === n ? true : null }, `${n} bar${n > 1 ? 's' : ''} per chord`)));

    [...seg.children].forEach((b, i) => b.onclick = () => { mode = i ? 'concert' : 'shape'; [...seg.children].forEach((x, j) => x.classList.toggle('on', j === i)); sheetWrap.innerHTML = ''; sheetWrap.append(renderSheet(a, mode)); });

      h('div', { class: 'row', style: 'margin-top:12px' }, h('a', { class: 'btn', href: `#/song/${id}/edit` }, 'Edit'),

  // ================================================================ PLAY-ALONG LADDER
  const RUNGS = [
    { n: 1, t: 'Strum only', d: 'Play the chords in time. No singing. Keep the strum going even if a chord is messy: never stop the hand.' },

  const PASSES_NEEDED = 2;
  route(/^\/play\/([\w-]+)$/, (id) => {
    const song = findSong(id);
    if (!song) return h('div', { class: 'card' }, 'Song not found. ', h('a', { href: '#/songs' }, 'Back'));
    const a = U.arrangement(song);

    song.layer = song.layer || { step: 1, passes: {} };
    song.layer.passes = song.layer.passes || {};
    let rung = song.layer.step;
    const el = h('div', null, U.sessionBanner('layer'), h('div', { class: 'row between' }, h('h2', null, song.title), h('a', { href: '#/song/' + id, class: 'small' }, 'Song settings')));
    const ladder = h('div', { class: 'ladder', id: 'ladder' });
    const desc = h('div', { class: 'small', style: 'margin-top:8px' });
    const nowCur = h('div', { class: 'cur', id: 'nowChord' }, '—'), nowDiag = h('div'), nowNext = h('div', { class: 'nx' });
    const slots = h('div', { class: 'slots' });

    pat.slots.split('').forEach((s, i) => slots.append(h('div', { class: 'slot' + (s !== '-' ? ' hit' : '') }, s === 'D' ? '↓' : s === 'U' ? '↑' : '·', h('span', { class: 'c' }, counts[i]))));
    const sheetWrap = h('div');
    const status = h('div', { class: 'mut small', id: 'playStatus' });
    const verdict = h('div', { class: 'hidden', id: 'verdict' });
    let backing = !!song.backing;
    const bpmV = h('b', null, (song.bpm || 70) + ' bpm');

    const firstLine = a.sheet.lines.findIndex((l) => l.type === 'pair' && l.items.length);
    function sequence(r) {
      if (r === 3 && firstLine >= 0) { const s = a.sheet.seq.filter((x) => x.line === firstLine); return [...s, ...s]; }

    }
    function paintLadder() {
      ladder.innerHTML = '';
      RUNGS.forEach((r) => {
        const locked = r.n > song.layer.step, passed = r.n < song.layer.step || (r.n === 4 && song.layer.done);
        ladder.append(h('button', { type: 'button', class: 'rung' + (r.n === rung ? ' on' : '') + (locked ? ' locked' : '') + (passed ? ' passed' : ''), onclick: () => { if (locked) { toast(`Pass step ${r.n - 1} twice to unlock`); return; } rung = r.n; paintLadder(); paintSheet(); } },
          h('b', null, passed ? '✓' : locked ? '–' : String(r.n)), r.t, locked ? h('span', { class: 'tiny', style: 'display:block' }, 'locked') : null));
      });
      const p = song.layer.passes[rung] || 0;
      desc.innerHTML = '';
      desc.append(h('b', null, `Step ${rung}: ${RUNGS[rung - 1].t}. `), RUNGS[rung - 1].d, h('div', { class: 'mut tiny', style: 'margin-top:4px' }, rung < 4 ? `Clean runs: ${p}/${PASSES_NEEDED} to unlock step ${rung + 1}.` : song.layer.done ? 'Completed. You can play and sing this song.' : 'One clean run completes the song.'));
    }
    function paintSheet(curSeq) {
      sheetWrap.innerHTML = '';
      const sh = renderSheet(a, 'shape', rung === 3 && firstLine >= 0 ? firstLine : undefined);
      sheetWrap.append(sh);
      if (curSeq !== undefined) {
        const elc = sh.querySelector(`[data-seq="${curSeq}"]`);
        if (elc) { elc.classList.add('cur'); elc.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
      }
    }
    function showChord(seqIdx, nextIdx) {
      const seq = a.sheet.seq;
      const cur = a.shapeNameOf(seq[seqIdx].chord);
      nowCur.textContent = cur;
      nowDiag.innerHTML = ''; const ch = C.parseChord(cur); nowDiag.append(U.diagram(ch ? C.voicing(ch) : null, 70));
      nowNext.textContent = nextIdx !== null && nextIdx !== undefined ? 'Next: ' + a.shapeNameOf(seq[nextIdx].chord) : 'Last chord';
      sheetWrap.querySelectorAll('.ch.cur').forEach((x) => x.classList.remove('cur'));
      const elc = sheetWrap.querySelector(`[data-seq="${seqIdx}"]`);
      if (elc) { elc.classList.add('cur'); const box = sheetWrap.firstChild; if (box && elc.offsetTop) box.scrollTop = elc.offsetTop - 40; }
    }
    let met = null;
    cleanup(() => met && met.stop());
    const go = h('button', { class: 'btn primary block', type: 'button', id: 'playGo' }, 'Start');
    const stop = () => { if (met) met.stop(); met = null; go.textContent = 'Start'; [...slots.children].forEach((s) => s.classList.remove('cur')); };
    go.onclick = async () => {
      if (met) { stop(); status.textContent = 'Stopped.'; return; }
      await A.ensure();
      verdict.classList.add('hidden');
      const seq = sequence(rung), bpc = song.barsPerChord || 1, bpm = song.bpm || 70;
      const seqIdxs = seq.map((x) => a.sheet.seq.indexOf(x));
      const total = 8 + seq.length * bpc * 8;
      go.textContent = 'Stop';
      const slotEls = [...slots.children];
      showChord(seqIdxs[0], seqIdxs[1] ?? null);
      met = A.metronome({
        bpm, eighths: false, totalEighths: total, startDelay: 0.4,
        onEighth: (i, t) => {
          slotEls.forEach((s) => s.classList.remove('cur'));
          if (i < 8) { status.textContent = `Count-in ${Math.floor(i / 2) + 1}…`; return; }
          slotEls[i % 8].classList.add('cur');
          const bar = Math.floor((i - 8) / 8), ci = Math.floor(bar / bpc);
          if ((i - 8) % (8 * bpc) === 0) {
            showChord(seqIdxs[ci], ci + 1 < seqIdxs.length ? seqIdxs[ci + 1] : null);
            if (backing) { const ch = C.parseChord(a.shapeNameOf(a.sheet.seq[seqIdxs[ci]].chord)); const v = ch && C.voicing(ch); if (v) A.strum(v.frets, a.capo, 0, 'D', 0.16); }
          }
          status.textContent = `Bar ${bar + 1} of ${seq.length * bpc}`;
          if (i === total - 1) setTimeout(finished, 60 / bpm / 2 * 1000 + 150);
        },
      });
    };
    function finished() {
      if (!met) return;
      stop();
      U.practised('layer');
      status.textContent = 'Run finished.';
      verdict.innerHTML = '';
      verdict.append(h('div', { style: 'font-weight:700;margin-bottom:6px' }, 'Did you get through without stopping your strumming hand?'),
        h('div', { class: 'row' },
          h('button', { class: 'btn primary grow', type: 'button', id: 'cleanYes', onclick: () => grade(true) }, 'Yes, clean run'),
          h('button', { class: 'btn grow', type: 'button', id: 'cleanNo', onclick: () => grade(false) }, 'No, I stopped')));
      verdict.classList.remove('hidden');
    }
    function grade(ok) {
      verdict.classList.add('hidden');
      if (!ok) {
        const slower = Math.max(40, (song.bpm || 70) - 5);
        status.innerHTML = '';
        status.append('No problem. Slowing down is the fastest fix. ', h('button', { class: 'btn sm', type: 'button', onclick: () => { song.bpm = slower; U.save(); bpmV.textContent = slower + ' bpm'; status.textContent = `Tempo now ${slower} bpm. Go again.`; } }, `Drop to ${slower} bpm`));
        return;
      }
      const L = song.layer;
      L.passes[rung] = (L.passes[rung] || 0) + 1;
      if (rung === 4) {
        L.done = true;
        if (!st().profile.firstSongAt) st().profile.firstSongAt = Date.now();
        status.textContent = 'Song complete: you played and sang it start to finish.';
        toast('First full song done!', 4000);
      } else if (L.passes[rung] >= PASSES_NEEDED && L.step === rung) {
        L.step = rung + 1; rung = L.step;
        status.textContent = `Step ${rung} unlocked.`;
        toast(`Step ${rung} unlocked`);
      } else status.textContent = `Clean run ${L.passes[rung]}/${PASSES_NEEDED}.`;
      U.save(); paintLadder(); paintSheet();
    }
    const backingBox = h('label', { class: 'small cbx' }, h('input', { type: 'checkbox', checked: backing, onchange: (e) => { backing = e.target.checked; song.backing = backing; U.save(); } }), 'App strums each new chord (helps you hear it)');
    el.append(h('div', { class: 'card' }, ladder, desc),
      h('div', { class: 'card' }, h('div', { class: 'now' }, nowCur, nowDiag, h('div', { class: 'grow' }, nowNext, h('div', { class: 'mut tiny' }, a.capo ? `Capo ${a.capo}` : 'No capo'), h('div', { class: 'mut tiny' }, pat.name))), slots, status, verdict,
        h('div', { style: 'margin-top:8px' }, go),
        h('div', { class: 'row between', style: 'margin-top:8px' }, backingBox, h('span', { class: 'row' }, bpmV,
          h('button', { class: 'btn sm', type: 'button', onclick: () => { song.bpm = Math.max(40, (song.bpm || 70) - 5); U.save(); bpmV.textContent = song.bpm + ' bpm'; } }, '−5'),
          h('button', { class: 'btn sm', type: 'button', onclick: () => { song.bpm = Math.min(160, (song.bpm || 70) + 5); U.save(); bpmV.textContent = song.bpm + ' bpm'; } }, '+5')))),
      sheetWrap);
    paintLadder(); paintSheet();
    showChord(sequence(rung).length ? a.sheet.seq.indexOf(sequence(rung)[0]) : 0, null);
    nowNext.textContent = 'Press Start';
    return el;
  }, 'songs');

  // ================================================================ PROGRESS
  route(/^\/progress$/, () => {
    const S = st(), t = U.today();
    const m = C.metrics(S, U.songPairs());
    const days = Object.keys(S.days);
    const el = h('div', null, h('h2', null, 'Progress'));
    el.append(h('div', { class: 'kpis' },
      h('div', { class: 'kpi' }, h('div', { class: 'v', id: 'kStreak' }, String(C.streak(days, t))), h('div', { class: 'l' }, 'day streak')),
      h('div', { class: 'kpi' }, h('div', { class: 'v' }, String(days.length)), h('div', { class: 'l' }, 'days practised')),
      h('div', { class: 'kpi' }, h('div', { class: 'v' }, S.profile.firstSongAt ? '✓' : S.profile.startDate ? String(Math.max(0, 21 - C.daysBetween(S.profile.startDate, t))) : '—'), h('div', { class: 'l' }, S.profile.firstSongAt ? 'first song done' : 'days to song target'))));
    const cal = h('div', { class: 'cal' });
    for (let i = 27; i >= 0; i--) { const d = C.addDays(t, -i); cal.append(h('span', { class: (S.days[d] ? 'on' : '') + (i === 0 ? ' today' : ''), title: d })); }
    el.append(h('div', { class: 'card' }, h('div', { class: 'mut small', style: 'margin-bottom:6px' }, 'Last 28 days'), cal));
    const metric = (title, val, target, unit, series, link) => h('div', { class: 'card' },
      h('div', { class: 'row between' }, h('h3', null, title), h('a', { href: link, class: 'small' }, 'Practise')),
      h('div', { class: 'row' }, h('span', { class: 'big ' + (val === null ? 'mut' : val >= target ? 'ok' : 'warn'), style: 'font-size:32px' }, val === null ? '—' : val + unit), h('span', { class: 'mut small' }, `target ${target}${unit}`)),
      series.length ? U.sparkline(series, { target }) : h('div', { class: 'mut small' }, 'No data yet.'));
    el.append(metric('Pitch accuracy', m.pitch, 70, '%', S.pitch.slice(-20).map((p) => p.acc), '#/voice/exercise'));
    el.append(metric(`Slowest chord change${m.slowestPair ? ` (${m.slowestPair.a} ↔ ${m.slowestPair.b})` : ''}`, m.slowestPair && m.slowestPair.best !== null && m.slowestPair.best !== undefined ? m.slowestPair.best : null, 30, '/min', S.changes.filter((c) => m.slowestPair && c.pair === m.slowestPair.key).slice(-20).map((c) => c.cpm), '#/guitar/changes'));
    el.append(metric('Strum timing', m.strum, 85, '%', S.strum.history.slice(-20).map((x) => x.score), '#/guitar/strum'));
    const pairs = {};
    S.changes.forEach((c) => { pairs[c.pair] = Math.max(pairs[c.pair] || 0, c.cpm); });
    if (Object.keys(pairs).length) el.append(h('div', { class: 'card' }, h('h3', null, 'Best changes per pair'), h('table', { class: 't' }, h('tr', null, h('th', null, 'Pair'), h('th', null, 'Best / min')), Object.entries(pairs).sort((x, y) => x[1] - y[1]).map(([k, v]) => h('tr', null, h('td', null, k.replace('|', ' ↔ ')), h('td', { class: v >= 30 ? 'ok' : 'warn' }, String(v)))))));
    el.append(h('div', { class: 'card small' }, h('b', null, 'Voice range: '), S.profile.range ? `${nn(S.profile.range.lo)} – ${nn(S.profile.range.hi)}` : 'not measured', ' · ', h('b', null, 'Songs: '), String(S.songs.length), ' · ', h('b', null, 'Completed: '), String(S.songs.filter((s) => s.layer && s.layer.done).length)));
    return el;
  }, 'progress');

  // ================================================================ SETTINGS
  route(/^\/settings$/, () => {
    const S = st();
    const num = (label, key, min, max, step, hint) => h('div', null, h('label', { class: 'f' }, label), h('input', { type: 'number', min, max, step, value: S.settings[key], style: 'width:120px', onchange: (e) => { const v = +e.target.value; if (v >= min && v <= max) { st().settings[key] = v; U.save(); U.applySettings(); toast('Saved'); } } }), hint ? h('div', { class: 'tiny mut' }, hint) : null);
    const file = h('input', { type: 'file', accept: 'application/json', class: 'hidden' });
    file.onchange = async () => {
      try {
        const data = JSON.parse(await file.files[0].text());
        if (!data || data.version !== 1 || !Array.isArray(data.songs)) throw new Error('Not a Riyaz backup');
        window.Riyaz.state = data; U.applySettings(); toast('Backup restored'); location.hash = '#/today'; U.render();
      } catch (e) { toast('Import failed: ' + e.message); }
    };
    return h('div', null, h('h2', null, 'Settings'),
      h('div', { class: 'card' }, h('h3', null, 'Pitch detection'),
        num('Reference A4 (Hz)', 'a4', 415, 466, 1, 'Leave at 440 unless you tune differently.'),
        num('Noise gate (dB)', 'gateDb', -80, -20, 1, 'Raise (e.g. −45) if room noise draws a line; lower (e.g. −65) if quiet singing drops out.'),
        num('Detection threshold', 'thr', 0.05, 0.3, 0.01, 'Lower = fewer wrong readings, more dropouts.'),
        h('label', { class: 'f' }, 'Analysis window'),
        h('select', { onchange: (e) => { st().settings.win = +e.target.value; U.save(); U.applySettings(); } }, [1024, 2048, 4096].map((n) => h('option', { value: n, selected: S.settings.win === n ? true : null }, n + (n === 2048 ? ' (default)' : n === 4096 ? ' (stabler, slower)' : ' (faster, voice only)')))),
        h('label', { class: 'small cbx', style: 'margin-top:10px' }, h('input', { type: 'checkbox', checked: S.settings.fold, onchange: (e) => { st().settings.fold = e.target.checked; U.save(); } }), 'Count the right note in any octave as in tune')),
      h('div', { class: 'card' }, h('h3', null, 'Timing'), h('div', { class: 'small' }, `Tap offset: ${S.profile.latencyMs || 0} ms. `, h('a', { href: '#/guitar/calibrate' }, 'Calibrate'))),
      h('div', { class: 'card' }, h('h3', null, 'Your data'), h('p', { class: 'small mut' }, 'Everything is stored only on this device. Export a backup before clearing browser data.'),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', onclick: () => { const b = new Blob([JSON.stringify(st(), null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(b); const l = h('a', { href: u, download: `riyaz-backup-${U.today()}.json` }); document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); } }, 'Export backup'),
          h('button', { class: 'btn', type: 'button', onclick: () => file.click() }, 'Import backup'), file,
          h('button', { class: 'btn danger', type: 'button', onclick: () => { if (confirm('Delete all progress and songs on this device?')) { localStorage.removeItem('riyaz.v1'); location.hash = '#/today'; location.reload(); } } }, 'Reset everything'))),
      h('div', { class: 'card tiny mut' }, 'Riyaz MVP · works offline after the first visit · no account, no tracking.'));
  }, null);

  // ================================================================ BOOT
  U.render();
  if (false) {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed', e));
  }
})();

</script>
</body>
</html>
